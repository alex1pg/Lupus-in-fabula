<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupus in fabula</title>
</head>
<body>
    <h1>Lupus in fabula</h1>

    <div id="schermataIniziale">
        <input type="text" id="inputNome" placeholder="Il tuo nome" />
        <button id="btnCrea">Crea stanza</button>
        <hr>
        <input type="text" id="inputCodice" placeholder="Codice stanza"/>

    <div id="lobby" style="display: none;">
        <h2>Stanza: <span id="codiceStanza"></span></h2>
        <button id="btnInizia" disabled>Inizia partita</button>
        <ul id="listaGiocatori"></ul>
    </div>


    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
